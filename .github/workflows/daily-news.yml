# 這個檔案要放在你的 GitHub repo 的路徑：
#   .github/workflows/daily-news.yml
#
# 排程時間採用 UTC，台灣是 UTC+8。
# 下面設定的 "0 0 * * *" = UTC 00:00 = 台灣時間每天早上 08:00。
# 如果想改時間，自行調整 cron 的分鐘/小時數字即可。

name: Daily Taiwan Neutral News

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 允許你在 GitHub 網頁上手動點「Run workflow」測試

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python fetch_news.py
